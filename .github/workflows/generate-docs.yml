name: Generate AI Documentation

on:
  push:
    branches:
      - master

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Generate Swagger JSON
        run: |
          dotnet tool restore || true
          swagger tofile --output swagger.json $(pwd)/bin/Release/net10.0/APIDocumentationSample.dll v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install openai

      - name: Generate docs via AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ./scripts/generate_docs.py --swagger swagger.json --out docs

      - name: Push docs to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Atul Nirbhavane"
          git config --global user.email "anirbhavane106@gmail.com"

          # Clone the wiki repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki

          # Copy generated docs into wiki
          cp -r docs/* wiki/

          cd wiki
          git add .
          git commit -m "chore(docs): auto-generated API docs" || echo "no changes to commit"
          git push
